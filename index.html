<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trần Dũng | Liên Kết</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    #particles-js {
      position: fixed;
      width: 100%;
      height: 100%;
      background: #1a1a1a;
      z-index: -1;
    }

    .profile {
      color: white;
      padding: 30px 0;
      text-align: center;
    }

    .profile img {
      border-radius: 50%;
      width: 120px;
      height: 120px;
      object-fit: cover;
      border: 3px solid white;
    }

    .profile h1 {
      margin: 10px 0 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .profile p {
      margin: 0;
      color: #ccc;
    }

    .tick {
      width: 20px;
      height: 20px;
    }

    .links {
      margin: 30px auto;
      max-width: 600px;
      padding: 0 20px;
    }

    .link-item {
      background-color: rgba(255, 255, 255, 0.1);
      margin: 10px 0;
      padding: 15px;
      border-radius: 8px;
      backdrop-filter: blur(10px);
      text-align: center;
      transition: transform 0.1s ease, box-shadow 0.2s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .link-item:active {
      transform: scale(0.96);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
    }

    .link-item a {
      text-decoration: none;
      color: white;
      font-weight: bold;
      position: relative;
      z-index: 1;
    }

    .link-item .ripple {
      position: absolute;
      width: 100px;
      height: 100px;
      background: rgba(255,255,255,0.3);
      border-radius: 50%;
      transform: scale(0);
      animation: rippleEffect 0.6s linear;
      pointer-events: none;
    }

    @keyframes rippleEffect {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Nền hiệu ứng particles -->
  <div id="particles-js"></div>

  <!-- Hồ sơ -->
  <div class="profile">
    <img src="https://www.w3schools.com/howto/img_avatar.png" alt="Avatar của bạn" />
    <h1>
      Trần Dũng
      <svg class="tick" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#1da1f2">
        <path d="M22 12c0-5.522-4.477-10-10-10S2 6.478 2 12s4.477 10 10 10 10-4.478 10-10zm-6.707-2.707l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 111.414-1.414L10 12.586l4.293-4.293a1 1 0 011.414 1.414z"/>
      </svg>
    </h1>
    <p>Chào mừng bạn đến với trang liên kết</p>
  </div>

  <!-- Các liên kết -->
  <div class="links">
    <div class="link-item">
      <a href="https://zalo.me/g/yourgroupid" target="_blank">Group Zalo</a>
    </div>
    <div class="link-item">
      <a href="https://youtube.com/@yourchannel" target="_blank">YouTube</a>
    </div>
    <div class="link-item">
      <a href="https://zalo.me/yourzaloid" target="_blank">Zalo</a>
    </div>
    <div class="link-item">
      <a href="https://t.me/yourtelegram" target="_blank">Telegram</a>
    </div>
  </div>

  <!-- Thư viện hiệu ứng particles.js -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script>
    particlesJS("particles-js", {
      particles: {
        number: { value: 80, density: { enable: true, value_area: 800 } },
        color: { value: "#ffffff" },
        shape: { type: "circle" },
        opacity: { value: 0.5 },
        size: { value: 3, random: true },
        line_linked: {
          enable: true,
          distance: 150,
          color: "#ffffff",
          opacity: 0.4,
          width: 1
        },
        move: {
          enable: true,
          speed: 4,
          direction: "none",
          out_mode: "out"
        }
      },
      interactivity: {
        events: {
          onhover: { enable: true, mode: "repulse" },
          onclick: { enable: true, mode: "push" }
        },
        modes: {
          repulse: { distance: 100 },
          push: { particles_nb: 4 }
        }
      },
      retina_detect: true
    });
  </script>

  <!-- Ripple effect script -->
  <script>
    document.querySelectorAll('.link-item').forEach(item => {
      item.addEventListener('click', function (e) {
        let ripple = document.createElement('span');
        ripple.classList.add('ripple');
        ripple.style.left = `${e.offsetX}px`;
        ripple.style.top = `${e.offsetY}px`;
        this.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
      });
    });
  </script>

</body>
</html>
